<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastWarm thermostats</title>
  <style>
    body {font: 16px system-ui, sans-serif; line-height: 1.5; max-width: 860px; margin: 24px auto; padding: 0 16px;}
    button, input {font: inherit; padding: 8px 12px; border: 1px solid #888; border-radius: 5px;}
    button {cursor: pointer;} button:disabled {cursor: wait;}
    .actions {display: flex; flex-wrap: wrap; gap: 8px;}
    .device, .connection {border: 1px solid #888; border-radius: 8px; padding: 16px; margin: 16px 0;}
    .device h3 {font-size: 1.1rem; margin: 0; overflow-wrap: anywhere;}
    .device p {margin: 8px 0; overflow-wrap: anywhere;}
    .device label {display: block; margin: 12px 0 6px;}
    .device input {box-sizing: border-box; max-width: 100%; margin: 0 8px 8px 0;}
    details {margin-top: 12px;} summary {cursor: pointer;}
    .hint {font-size: .9rem;} .result {margin-bottom: 0;} .stored {color: #37834b;}
  </style>
</head>
<body>
  <h2>FastWarm thermostats</h2>
  <p>Temperatures and thermostat controls use local connections. Manage the shared Home, Away and Holiday programmes in the <strong>Heating Programmes</strong> plugin.</p>
  <div class="actions">
    <button id="settings" type="button">FastWarm settings</button>
    <button id="refresh" type="button">Reload saved connections</button>
  </div>
  <p id="notice" role="status" aria-live="polite"></p>
  <div id="connections"></div>
  <div id="devices"></div>
  <script>
    const homebridge = window.homebridge;
    const devices = document.getElementById('devices');
    const connections = document.getElementById('connections');
    const notice = document.getElementById('notice');
    document.getElementById('settings').addEventListener('click', openSettings);
    document.getElementById('refresh').addEventListener('click', loadDevices);

    function element(tag, text) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function newInstanceId() {
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
    }

    async function openSettings() {
      const button = document.getElementById('settings');
      if (button.disabled) return;
      button.disabled = true;
      try {
        const current = await homebridge.getPluginConfig();
        if (!Array.isArray(current)) throw new Error();
        let changed = false;
        const draft = current.length ? current.map(block => {
          if (block && block.platform === 'FastWarmPlatform' && !Object.prototype.hasOwnProperty.call(block, 'instanceId')) {
            changed = true;
            return {...block, instanceId: newInstanceId()};
          }
          return block;
        }) : [{platform: 'FastWarmPlatform', name: 'FastWarm', instanceId: newInstanceId(), devices: []}];
        if (changed || !current.length) await homebridge.updatePluginConfig(draft);
        await homebridge.showSchemaForm();
      } catch {
        notice.textContent = 'Settings could not be opened. Reload this page and try again.';
      } finally {
        button.disabled = false;
      }
    }

    function connectionCard(instance) {
      const card = element('section');
      card.className = 'connection';
      card.appendChild(element('strong', 'Local connections only'));
      card.appendChild(element('p', instance.deviceCount + ' enabled thermostat' + (instance.deviceCount === 1 ? '' : 's') + '. No routine Tuya cloud login or notification connection.'));
      if (!instance.cloudRefreshAvailable) {
        card.appendChild(element('p', 'SmartLife account details are optional. Add them in FastWarm settings if you want to import updated room or device names.'));
        return card;
      }
      card.appendChild(element('p', 'Import room or device names only when needed. This makes cloud read requests and saves device information; it does not change heating settings.'));
      const refresh = element('button', 'Import names from SmartLife');
      refresh.type = 'button';
      refresh.disabled = instance.deviceCount < 1;
      card.appendChild(refresh);
      const result = element('p');
      result.className = 'result';
      result.setAttribute('role', 'status');
      result.setAttribute('aria-live', 'polite');
      card.appendChild(result);
      refresh.addEventListener('click', async () => {
        refresh.disabled = true;
        result.textContent = 'Reading device information from SmartLife…';
        try {
          const response = await homebridge.request('/local/refresh', {instanceId: instance.instanceId});
          if (response.refreshed !== true || response.restartRequired !== true || response.deviceCount !== instance.deviceCount) throw new Error();
          result.textContent = 'Device information imported. Restart the FastWarm child bridge to use the updated names.';
        } catch {
          result.textContent = 'The import could not be confirmed. Check the optional SmartLife settings before trying again.';
        } finally {
          refresh.disabled = false;
        }
      });
      return card;
    }

    function deviceCard(device, labels) {
      const card = element('section');
      card.className = 'device';
      card.appendChild(element('h3', labels.roomName || labels.name || 'FastWarm thermostat'));
      if (labels.roomName && labels.name && labels.name !== labels.roomName) card.appendChild(element('p', labels.name));
      const identity = element('p', device.deviceId + ' · ' + device.address + ' · Protocol ' + device.version + (device.enabled ? '' : ' · Disabled in settings'));
      identity.className = 'hint';
      card.appendChild(identity);
      const stored = element('p', device.keyStored ? 'Private device key stored' : 'Private device key needed');
      stored.className = device.keyStored ? 'stored' : '';
      card.appendChild(stored);
      const details = element('details');
      details.appendChild(element('summary', device.keyStored ? 'Replace device key' : 'Add device key'));
      const form = element('form');
      const label = element('label', 'Local device key');
      const key = element('input');
      key.type = 'password';
      key.autocomplete = 'off';
      key.spellcheck = false;
      key.minLength = 16;
      key.maxLength = 16;
      key.required = true;
      label.appendChild(key);
      form.appendChild(label);
      const save = element('button', 'Save device key');
      save.type = 'submit';
      form.appendChild(save);
      const result = element('p');
      result.className = 'result';
      result.setAttribute('role', 'status');
      result.setAttribute('aria-live', 'polite');
      form.appendChild(result);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const localKey = key.value;
        key.value = '';
        result.textContent = '';
        if (!/^[\x20-\x7e]{16}$/.test(localKey)) {
          result.textContent = 'Enter a 16-character device key using printable ASCII characters.';
          return;
        }
        save.disabled = true;
        try {
          const response = await homebridge.request('/local/key', {instanceId: device.instanceId, deviceId: device.deviceId, localKey});
          if (response.stored !== true || response.restartRequired !== true) throw new Error();
          stored.textContent = 'Private device key stored';
          stored.className = 'stored';
          result.textContent = 'Key saved. Restart the FastWarm child bridge to use it.';
        } catch {
          result.textContent = 'The key could not be saved. Check FastWarm settings and try again.';
        } finally {
          key.value = '';
          save.disabled = false;
        }
      });
      details.appendChild(form);
      card.appendChild(details);
      return card;
    }

    async function loadDevices() {
      document.getElementById('refresh').disabled = true;
      devices.replaceChildren();
      connections.replaceChildren();
      notice.textContent = 'Loading saved connections…';
      try {
        const response = await homebridge.request('/local/devices');
        const modes = await homebridge.request('/local/instances');
        const labels = await homebridge.request('/local/names');
        if (!response || !Array.isArray(response.devices) || !modes || !Array.isArray(modes.instances) || !labels || !Array.isArray(labels.names)) throw new Error();
        for (const device of response.devices) {
          const name = labels.names.find(item => item.instanceId === device.instanceId && item.deviceId === device.deviceId) || {};
          devices.appendChild(deviceCard(device, name));
        }
        for (const instance of modes.instances) connections.appendChild(connectionCard(instance));
        notice.textContent = response.devices.length ? '' : 'No thermostats configured. Add a saved device ID, LAN address and protocol 3.5 in FastWarm settings.';
      } catch {
        notice.textContent = 'Local setup is unavailable. Check FastWarm settings and Homebridge file permissions.';
      } finally {
        document.getElementById('refresh').disabled = false;
      }
    }
    loadDevices();
  </script>
</body>
</html>
